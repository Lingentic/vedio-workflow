<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快手商品信息采集器</title><link rel="stylesheet" href="popup.css"></head>
<body><main><h1>快手商品信息采集器</h1><p>输入选品中心详情页地址中的 relItemId。</p><form id="lookup"><label for="id">商品 ID</label><input id="id" inputmode="numeric" pattern="[0-9]{8,30}" required placeholder="例如 25762544052958"><button>打开详情页并读取</button></form><p id="status" role="status"></p><section id="result" hidden><h2>读取结果</h2><dl id="fields"></dl><p id="warnings"></p><button id="copy" type="button">复制 JSON</button></section></main><script type="module" src="popup.js"></script></body></html>
